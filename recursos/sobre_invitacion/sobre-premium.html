<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Kelsey &amp; Enoc — Te invitamos a nuestra boda</title>

  <!-- Tipografías: script fina (Great Vibes) + serif elegante (Cormorant) + sans ligera (Montserrat) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">

  <style>
    /* =====================================================================
       1. TOKENS DE DISEÑO
       ===================================================================== */
    :root {
      /* Paleta: blancos, ivory/beige, grises suaves */
      --white:      #ffffff;
      --ink:        #2c2c2c;   /* texto principal */
      --muted:      #857f74;   /* texto secundario */
      --line:       #4a4a4a;   /* líneas de la solapa */
      --gold:       #b9a37a;   /* acento del "&" */

      /* Cera del sello */
      --wax-hi:     #f7ecd2;
      --wax:        #e8d9b5;
      --wax-lo:     #d9c69a;
      --wax-ink:    #5c5346;

      /* Curva de easing pedida: suave y elegante */
      --ease:       cubic-bezier(0.4, 0, 0.2, 1);

      /* Textura de papel (ruido fractal muy sutil) y textura de cera */
      --noise-paper: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='160'%20height='160'%3E%3Cfilter%20id='p'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.9'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3CfeColorMatrix%20type='saturate'%20values='0'/%3E%3C/filter%3E%3Crect%20width='160'%20height='160'%20filter='url(%23p)'%20opacity='0.05'/%3E%3C/svg%3E");
      --noise-wax:   url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='120'%20height='120'%3E%3Cfilter%20id='w'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.65'%20numOctaves='3'%20stitchTiles='stitch'/%3E%3CfeColorMatrix%20type='saturate'%20values='0'/%3E%3C/filter%3E%3Crect%20width='120'%20height='120'%20filter='url(%23w)'%20opacity='0.16'/%3E%3C/svg%3E");
    }

    /* =====================================================================
       2. RESET
       ===================================================================== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--ink);
      background: #efece6;
      overflow: hidden;                       /* sin scroll: todo ocurre en una pantalla */
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    /* =====================================================================
       3. "DEVICE": en el teléfono ocupa toda la pantalla.
          En desktop se muestra como un iPhone centrado (solo previsualización).
       ===================================================================== */
    .device {
      position: relative;
      width: 100%;
      height: 100vh;                          /* fallback */
      height: 100dvh;                         /* alto real en móvil (barra del navegador) */
      overflow: hidden;
      background-color: var(--white);
      background-image: var(--noise-paper);   /* papel ligeramente texturizado */
    }

    @media (min-width: 640px) {
      body { display: grid; place-items: center; }
      .device {
        width: 390px;
        height: 844px;
        border-radius: 46px;
        box-shadow:
          0 0 0 11px #111,
          0 0 0 13px #3a3a3a,
          0 34px 70px rgba(0, 0, 0, .28);
      }
    }

    /* =====================================================================
       4. SOBRE
       Sólo hay DOS solapas (mitad izquierda y mitad derecha). Ambas son
       blancas, así que su unión es invisible: lo único que se ve son las
       dos líneas diagonales finas que dibuja cada mitad. Juntas forman la
       "V" clásica del sobre, con el vértice en el centro exacto.
       ===================================================================== */
    .envelope {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(88vw, 460px);
      aspect-ratio: 1.55 / 1;                 /* proporción de sobre de carta */
      perspective: 1500px;                    /* profundidad para el giro 3D */
      z-index: 5;
    }

    /* Sombra suave del papel (una sola sombra para todo el sobre, así no
       aparece una costura en el medio). Se desvanece al abrir. */
    .envelope__paper {
      position: absolute;
      inset: 0;
      border-radius: 5px;
      box-shadow:
        0 18px 40px rgba(80, 70, 55, .10),
        0 4px 12px rgba(80, 70, 55, .06);
      transition: opacity .8s ease .1s;
    }

    .flap {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      background: var(--white);
      transition: transform 1s var(--ease), opacity .9s ease;
      will-change: transform, opacity;
    }
    .flap--left  { left: 0;  transform-origin: left center;  }
    .flap--right { right: 0; transform-origin: right center; }

    /* La línea diagonal vive DENTRO de cada solapa, así se mueve con ella. */
    .flap__seam {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .flap__seam line {
      stroke: var(--line);
      stroke-width: 1;
    }

    /* --- Estado abierto: cada mitad gira hacia afuera y se desvanece --- */
    .is-opening .flap--left  { transform: translateX(-18%) rotateY(-38deg); opacity: 0; }
    .is-opening .flap--right { transform: translateX(18%)  rotateY(38deg);  opacity: 0; }
    .is-opening .envelope__paper { opacity: 0; }

    /* =====================================================================
       5. SELLO DE LACRE
       ===================================================================== */
    .seal-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;                            /* por encima del sobre y de la invitación */
      transition: opacity .9s ease 1.7s, transform .9s ease 1.7s, visibility 0s linear 2.6s;
    }
    /* El sello se queda un momento superpuesto sobre la invitación y luego se va */
    .is-opening .seal-wrap {
      opacity: 0;
      transform: translate(-50%, -50%) scale(.82);
      visibility: hidden;
      pointer-events: none;
    }

    .seal {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: clamp(88px, 26vw, 118px);
      aspect-ratio: 1;
      padding: 0;
      border: 0;
      cursor: pointer;
      color: var(--wax-ink);

      /* Cera: degradado radial + ruido fractal = textura realista */
      background-image: var(--noise-wax),
        radial-gradient(circle at 34% 28%, var(--wax-hi) 0%, var(--wax) 52%, var(--wax-lo) 100%);
      background-size: 70px 70px, auto;

      /* Borde irregular: 24 puntos levemente desviados del círculo,
         como cera prensada a mano */
      -webkit-clip-path: polygon(99% 50%, 98.3% 62.9%, 92% 74.3%, 85.4% 85.4%, 74.8% 92.9%, 62.4% 96.4%, 50% 99.5%, 37.1% 98.3%, 25.7% 92%, 14.6% 85.4%, 7.6% 74.5%, 1.7% 62.9%, 2% 50%, 2.2% 37.2%, 6.7% 25%, 15.7% 15.7%, 25% 6.7%, 37.3% 2.7%, 50% 1.5%, 62.9% 1.7%, 74.8% 7.1%, 83.9% 16.1%, 93.3% 25%, 97.3% 37.3%);
              clip-path: polygon(99% 50%, 98.3% 62.9%, 92% 74.3%, 85.4% 85.4%, 74.8% 92.9%, 62.4% 96.4%, 50% 99.5%, 37.1% 98.3%, 25.7% 92%, 14.6% 85.4%, 7.6% 74.5%, 1.7% 62.9%, 2% 50%, 2.2% 37.2%, 6.7% 25%, 15.7% 15.7%, 25% 6.7%, 37.3% 2.7%, 50% 1.5%, 62.9% 1.7%, 74.8% 7.1%, 83.9% 16.1%, 93.3% 25%, 97.3% 37.3%);

      /* Relieve: brillo arriba-izquierda, sombra abajo, y caída sobre el papel */
      box-shadow:
        inset 0 2px 5px rgba(255, 255, 255, .60),
        inset 0 -5px 12px rgba(140, 120, 80, .35),
        0 6px 16px rgba(120, 100, 60, .25);

      transition: transform .25s ease;
    }
    .seal:active { transform: scale(.96); }
    .seal:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }

    /* Anillo del cuño, prensado dentro de la cera */
    .seal__ring {
      position: absolute;
      inset: 13%;
      border-radius: 50%;
      border: 1px solid rgba(90, 80, 60, .22);
    }

    .seal__initials {
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      font-weight: 500;
      font-size: clamp(19px, 6.2vw, 27px);
      letter-spacing: .06em;
      line-height: 1;
    }
    .seal__amp {
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      font-size: clamp(11px, 3.4vw, 15px);
      line-height: 1;
      margin-top: .12em;
      opacity: .8;
    }

    /* =====================================================================
       6. TOOLTIP "¡Toca Aquí!"
       ===================================================================== */
    .tooltip {
      position: absolute;
      bottom: calc(100% + 14px);
      left: 50%;
      transform: translate(-50%, 0);
      padding: 8px 14px;
      border-radius: 9px;
      background: #141414;
      color: #fff;
      font-size: 12.5px;
      font-weight: 400;
      letter-spacing: .02em;
      white-space: nowrap;
      pointer-events: none;
      animation: tooltipFloat 2.4s ease-in-out infinite;
    }
    /* Flecha hacia abajo, apuntando al sello */
    .tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: #141414;
    }
    @keyframes tooltipFloat {
      0%, 100% { transform: translate(-50%, 0); }
      50%      { transform: translate(-50%, -5px); }
    }
    /* Al hacer click desaparece al instante */
    .is-opening .tooltip {
      opacity: 0;
      animation: none;
      transition: opacity .1s linear;
    }

    /* =====================================================================
       7. CONTENIDO DE LA INVITACIÓN
       Aparece 0.5s después de que el sello quede solo (las solapas tardan 1s).
       ===================================================================== */
    .invitation {
      position: absolute;
      inset: 0;
      z-index: 10;                            /* debajo del sello (20) para que éste la solape */
      display: flex;
      flex-direction: column;
      background: var(--white);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      overflow-y: auto;
      transition: opacity .9s ease 1.5s,
                  transform .9s ease 1.5s,
                  visibility 0s linear 1.5s;
      transform: scale(.98);
    }
    .is-opening .invitation {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
      pointer-events: auto;
    }

    /* --- Encabezado blanco y limpio --- */
    .invitation__header {
      padding: calc(env(safe-area-inset-top, 0px) + 40px) 26px 30px;
      text-align: center;
      background: var(--white);
    }

    .invitation__names {
      font-family: 'Great Vibes', 'Cormorant Garamond', cursive;
      font-weight: 400;
      font-size: clamp(40px, 12.5vw, 56px);
      line-height: 1.08;
      color: var(--ink);
    }
    .invitation__names .amp { color: var(--gold); }

    .invitation__subtitle {
      margin-top: 12px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      font-size: 11.5px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* --- Fotografía de la pareja (placeholder degradado debajo) --- */
    .invitation__photo {
      flex: 1;
      min-height: 0;
      background-image:
        linear-gradient(180deg, rgba(255, 255, 255, .75) 0%, rgba(255, 255, 255, 0) 26%),
        url('https://images.unsplash.com/photo-1519741497674-611481863552?w=900&q=80'),
        linear-gradient(160deg, #f3ebe0 0%, #e2d7c6 100%);
      background-size: auto, cover, auto;
      background-position: center, center, center;
      background-repeat: no-repeat, no-repeat, no-repeat;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* =====================================================================
       8. ACCESIBILIDAD: menos movimiento
       ===================================================================== */
    @media (prefers-reduced-motion: reduce) {
      .tooltip { animation: none; }

      .flap,
      .envelope__paper,
      .seal-wrap,
      .invitation {
        transition-duration: .01s !important;
        transition-delay: 0s !important;
      }
      /* Saltamos directo al estado final de la apertura */
      .is-opening .invitation { opacity: 1; visibility: visible; transform: none; pointer-events: auto; }
      .is-opening .seal-wrap  { opacity: 0; visibility: hidden; }
      .is-opening .flap--left  { transform: translateX(-18%) rotateY(-38deg); opacity: 0; }
      .is-opening .flap--right { transform: translateX(18%)  rotateY(38deg);  opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="device">

    <!-- ============ SOBRE: dos solapas que forman la "V" clásica ============ -->
    <div class="envelope" id="envelope" aria-hidden="true">
      <span class="envelope__paper"></span>

      <!-- Mitad izquierda: línea de la esquina superior-izquierda al centro -->
      <div class="flap flap--left">
        <svg class="flap__seam" viewBox="0 0 100 100" preserveAspectRatio="none">
          <line x1="0" y1="0" x2="100" y2="100" vector-effect="non-scaling-stroke"/>
        </svg>
      </div>

      <!-- Mitad derecha: línea de la esquina superior-derecha al centro -->
      <div class="flap flap--right">
        <svg class="flap__seam" viewBox="0 0 100 100" preserveAspectRatio="none">
          <line x1="100" y1="0" x2="0" y2="100" vector-effect="non-scaling-stroke"/>
        </svg>
      </div>
    </div>

    <!-- ============ SELLO DE LACRE + TOOLTIP ============ -->
    <div class="seal-wrap" id="sealWrap">
      <button class="seal" id="seal" type="button" aria-label="Abrir la invitación de Kelsey y Enoc">
        <span class="seal__ring" aria-hidden="true"></span>
        <span class="seal__initials">K.E</span>
        <span class="seal__amp">&amp;</span>
      </button>

      <span class="tooltip" aria-hidden="true">¡Toca Aquí!</span>
    </div>

    <!-- ============ INVITACIÓN ============ -->
    <section class="invitation" id="invitation" aria-label="Invitación de boda de Kelsey y Enoc">
      <header class="invitation__header">
        <h1 class="invitation__names">Kelsey <span class="amp">&amp;</span> Enoc</h1>
        <p class="invitation__subtitle">Te invitamos a nuestra boda</p>
      </header>

      <div class="invitation__photo" role="img" aria-label="Fotografía de la pareja"></div>
    </section>

  </div>

  <script>
    /* ---------------------------------------------------------------------
       JavaScript mínimo: un solo listener.
       Todo el encadenado de la animación (tooltip → solapas → sello solo →
       invitación → sello superpuesto que se va) vive en CSS con
       transition-delay, así que aquí no hay ningún setTimeout.
       --------------------------------------------------------------------- */
    (function () {
      var seal = document.getElementById('seal');
      if (!seal) return;

      seal.addEventListener('click', function () {
        document.body.classList.add('is-opening');
      }, { once: true });   // { once: true } evita re-disparos si tocara de nuevo
    })();
  </script>

</body>
</html>
